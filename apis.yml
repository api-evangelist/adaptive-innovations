aid: adaptive-innovations
name: Adaptive Innovations
description: >-
  Adaptive Innovations Co. is an AI-native home health provider headquartered in New York, NY, with
  operations centered in Texas. Founded in 2025 by Alex Wendland and Logan Stinson (co-CEOs), Hunter
  Stinson (COO) and Ryan Tolsma (CTO), the company pairs clinicians in the home with an internally
  built "AI operating system" that automates medical intake, scheduling, charting, and compliance
  billing. It delivers care under the Adaptive Home Health brand (adaptivehh.com), a Medicare-certified
  agency that reports 100,000+ patient visits, 500+ referring healthcare organizations and roughly 500
  clinical staff. Adaptive raised $60M across a Seed and a $50M Series A (June 2026) led by Felicis and
  Bain Capital Ventures, with Optum Ventures, BoxGroup, Conviction, SV Angel, Sunflower Capital,
  Constellation and Dorm Room Fund participating. Its software is operated internally and shipped to
  patients and clinicians as an iOS/Android app; as of this profile Adaptive publishes no public
  developer program, API reference, or machine-readable contract.
